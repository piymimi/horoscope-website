<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Horoscopes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Horoscopes</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <div class="zodiac-selection" id="zodiacSelection">
            <h2>Select Your Zodiac Sign</h2>
            <div class="sign-selector" id="signSelector">
            </div>
        </div>

        <div class="horoscope-display" id="horoscopeDisplay" style="display: none;">
            <button class="back-button" id="backButton">
                <i class="fas fa-arrow-left"></i> Back to All Signs
            </button>
            <div class="detailed-horoscope" id="detailedHoroscope">
            </div>
        </div>

        <div class="zodiac-grid" id="zodiacGrid">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
