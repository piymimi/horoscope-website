<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Horoscope</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-moon"></i> Daily Horoscope</h1>
            <p id="currentDate" class="date"></p>
        </header>

        <div id="signSelector" class="sign-selector"></div>

        <div id="zodiacSelection" class="zodiac-selection">
            <h2><i class="fas fa-star"></i> Select Your Zodiac Sign</h2>
            <div id="zodiacGrid" class="zodiac-grid"></div>
        </div>

        <div id="horoscopeDisplay" class="horoscope-display">
            <button id="backButton" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to All Signs
            </button>
            <div id="detailedHoroscope" class="detailed-horoscope"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
