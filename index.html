<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Horoscope | Celestial Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>
<body>
    <div class="stars-bg"></div>
    <div class="container">
        <header>
            <div class="header-decoration"></div>
            <h1><span class="moon-icon"><i class="fas fa-moon"></i></span> Daily Horoscope</h1>
            <p id="currentDate" class="date"></p>
        </header>

        <div id="zodiacSelection" class="zodiac-selection fade-in">
            <div class="section-header">
                <h2><i class="fas fa-star"></i> Choose Your Zodiac Sign</h2>
                <p class="section-subtitle">Discover what the stars have aligned for you today</p>
            </div>
            <div id="zodiacGrid" class="zodiac-grid"></div>
        </div>

        <div id="generalHoroscope" class="general-horoscope">
            <div class="day-navigation">
                <button class="day-tab" data-day="-1"><i class="fas fa-chevron-left"></i> Yesterday</button>
                <button class="day-tab active" data-day="0">Today</button>
                <button class="day-tab" data-day="1">Tomorrow <i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="horoscope-card">
                <div class="horoscope-icon">
                    <i class="fas fa-sun"></i>
                </div>
                <div class="horoscope-content">
                    <h3 id="generalHoroscopeTitle">Today's Cosmic Energy</h3>
                    <p id="generalHoroscopeText">Loading...</p>
                </div>
            </div>
        </div>

        <div id="signSelector" class="sign-selector"></div>

        <div id="horoscopeDisplay" class="horoscope-display hidden">
            <button id="backButton" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to All Signs
            </button>
            <div id="detailedHoroscope" class="detailed-horoscope"></div>
        </div>
    </div>

    <script src="script.js?v=1.1"></script>
</body>
</html>
